spring.application.name=spamguard-capstone
server.port=8080

# Internal Embedded Database for Scan History & Telemetry
spring.datasource.url=jdbc:h2:mem:spamguard_capstone;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Raw H2 Web Console Disabled
spring.h2.console.enabled=false

# External Threat Intelligence APIs (Optional)
shieldguard.safebrowsing.api-key=${SAFEBROWSING_API_KEY:}
shieldguard.virustotal.api-key=${VIRUSTOTAL_API_KEY:}
spamdetector.ai.enabled=false
spamdetector.ai.api-key=${GEMINI_API_KEY:}
spamdetector.ai.provider=gemini
shieldguard.webhook.alert-url=${INCIDENT_WEBHOOK_URL:}
